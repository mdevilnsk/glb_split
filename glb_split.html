<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Animation Editor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115; color: #e8eaed; overflow: hidden;
    }
    body { display: flex; }

    /* --- 3D Viewport --- */
    #viewport { flex: 1; position: relative; background: #14161a; min-width: 0; }
    #viewport canvas { display: block; outline: none; }

    #dropzone {
      position: absolute; inset: 24px; border: 2px dashed #2d3139; border-radius: 16px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; background: rgba(22, 24, 29, 0.9); z-index: 10;
    }
    #dropzone:hover, #dropzone.active { border-color: #7c5cff; background: rgba(26, 29, 36, 0.95); }
    #dropzone .icon { font-size: 64px; margin-bottom: 16px; }
    #dropzone .label { font-size: 18px; font-weight: 500; }
    #dropzone .hint { font-size: 14px; color: #8b8f99; margin-top: 8px; }
    input[type="file"] { display: none; }

    /* --- Resizer --- */
    #resizer {
      width: 6px; background: #0f1115; cursor: col-resize;
      position: relative; transition: background 0.15s; flex-shrink: 0;
    }
    #resizer::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 2px; height: 40px;
      background: #2d3139; border-radius: 2px; transition: background 0.15s;
    }
    #resizer:hover, #resizer.dragging { background: #7c5cff33; }
    #resizer:hover::after, #resizer.dragging::after { background: #7c5cff; }

    /* --- Sidebar --- */
    .sidebar {
      width: 420px; min-width: 340px; max-width: 720px;
      background: #16181d; border-left: 1px solid #2d3139;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-header { padding: 14px 16px 10px; border-bottom: 1px solid #2d3139; flex-shrink: 0; }
    h1 {
      font-size: 18px; font-weight: 700; margin-bottom: 2px;
      background: linear-gradient(90deg, #7c5cff, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .subtitle { color: #8b8f99; font-size: 11px; }
    
    kbd {
      background: #2d3139;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 10px;
      color: #c4b5fd;
      border: 1px solid #3a3f4a;
    }
    .sidebar-body {
      flex: 1; overflow-y: auto; padding: 12px 16px; min-height: 0;
    }
    .sidebar-body::-webkit-scrollbar { width: 8px; }
    .sidebar-body::-webkit-scrollbar-track { background: transparent; }
    .sidebar-body::-webkit-scrollbar-thumb { background: #2d3139; border-radius: 4px; }
    .sidebar-body::-webkit-scrollbar-thumb:hover { background: #3a3f4a; }

    .sidebar-footer {
      padding: 12px 16px; border-top: 1px solid #2d3139;
      flex-shrink: 0; background: #16181d;
    }

    .section-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      color: #6b7280; margin: 12px 0 6px; font-weight: 600;
    }
    .section-title:first-child { margin-top: 0; }

    /* --- Animations List --- */
    #animations { display: flex; flex-direction: column; gap: 3px; }
    .anim-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 6px; background: #1e2128; cursor: pointer;
      border: 1px solid transparent; transition: all 0.15s; font-size: 12px;
    }
    .anim-item:hover { background: #252932; }
    .anim-item.active { border-color: #7c5cff; background: #1a1d24; }
    .anim-item input[type="radio"] { accent-color: #7c5cff; cursor: pointer; }
    .anim-item label { cursor: pointer; flex: 1; }
    .anim-item .index { font-size: 10px; color: #6b7280; font-family: monospace; }

    /* --- Timeline Container --- */
    .timeline-container { display: none; }
    .timeline-container.visible { display: block; }

    .time-labels {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: #8b8f99; margin-bottom: 4px; font-family: monospace;
    }
    .time-labels .sel-info { color: #c4b5fd; }

    /* --- Timeline Scroll & Track --- */
    .timeline-scroll {
      overflow-x: auto;
      overflow-y: hidden;
      border-radius: 8px;
      background: #1e2128;
      border: 1px solid #2d3139;
      position: relative;
    }
    .timeline-scroll::-webkit-scrollbar { height: 8px; }
    .timeline-scroll::-webkit-scrollbar-track { background: #0f1115; }
    .timeline-scroll::-webkit-scrollbar-thumb { background: #2d3139; border-radius: 4px; }
    .timeline-scroll::-webkit-scrollbar-thumb:hover { background: #3a3f4a; }

    .track {
      position: relative;
      height: 70px;
      cursor: crosshair;
      user-select: none;
      min-width: 100%;
    }

    /* Ruler */
    .ruler {
      position: absolute; top: 0; left: 0; right: 0; height: 18px;
      border-bottom: 1px solid #2d3139; pointer-events: none;
    }
    .tick {
      position: absolute; top: 0; height: 100%;
      border-left: 1px solid #2d3139;
      pointer-events: none;
    }
    .tick.major { border-left-color: #4b5563; }
    .tick-label {
      position: absolute; top: 1px; left: 3px;
      font-size: 9px; color: #6b7280; font-family: monospace;
      white-space: nowrap; pointer-events: none;
    }

    /* Segments layer */
    .segments-layer {
      position: absolute; top: 20px; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 2;
    }
    .segment-block {
      position: absolute; top: 4px; height: 30px;
      background: rgba(124, 92, 255, 0.25);
      border: 1px solid rgba(124, 92, 255, 0.7);
      border-radius: 3px;
      overflow: hidden;
    }
    .segment-block-label {
      position: absolute; top: 50%; left: 4px;
      transform: translateY(-50%);
      font-size: 9px; color: #ddd6fe; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
      max-width: calc(100% - 8px);
      font-weight: 600; padding-right: 4px;
    }

    /* Selection region */
    .selection {
      position: absolute; top: 20px; bottom: 0;
      background: rgba(34, 211, 238, 0.08);
      border-top: 1px solid rgba(34, 211, 238, 0.4);
      border-bottom: 1px solid rgba(34, 211, 238, 0.4);
      pointer-events: none; z-index: 3;
    }

    /* Handles */
    .handle {
      position: absolute; top: 16px; bottom: 0;
      width: 14px; margin-left: -7px;
      cursor: ew-resize; z-index: 6;
      display: flex; flex-direction: column; align-items: center;
    }
    .handle .handle-bar {
      width: 3px; height: 100%;
      background: #22d3ee;
      box-shadow: 0 0 6px rgba(34, 211, 238, 0.7);
      border-radius: 2px;
      transition: background 0.15s;
    }
    .handle:hover .handle-bar { background: #67e8f9; box-shadow: 0 0 10px rgba(34, 211, 238, 1); }
    .handle .handle-grip {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 14px; height: 14px;
      background: #22d3ee;
      border-radius: 50%;
      border: 2px solid #0f1115;
      box-shadow: 0 0 8px rgba(34, 211, 238, 0.8);
    }
    .handle:hover .handle-grip { background: #67e8f9; }
    .handle-start .handle-grip::before,
    .handle-end .handle-grip::before {
      content: ''; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 0; height: 0;
    }
    .handle-start .handle-grip::after {
      content: '◀'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 8px; color: #0f1115; font-weight: 900;
    }
    .handle-end .handle-grip::after {
      content: '▶'; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 8px; color: #0f1115; font-weight: 900;
    }

    /* Playhead */
    .playhead {
      position: absolute; top: 0; bottom: 0; width: 2px;
      background: #f87171; pointer-events: none; z-index: 5;
      box-shadow: 0 0 6px rgba(248, 113, 113, 0.9);
      margin-left: -1px;
    }
    .playhead::before {
      content: ''; position: absolute; top: 0; left: -5px;
      width: 12px; height: 12px;
      background: #f87171;
      clip-path: polygon(0 0, 100% 0, 50% 100%);
    }

    /* --- Zoom Row --- */
    .zoom-row {
      display: flex; align-items: center; gap: 6px; margin-top: 8px;
    }
    .zoom-btn {
      padding: 4px 10px; border-radius: 5px; border: none; background: #2d3139;
      color: #e8eaed; cursor: pointer; font-size: 14px; font-weight: 700;
      transition: background 0.15s; min-width: 30px;
    }
    .zoom-btn:hover { background: #3a3f4a; }
    .zoom-btn.fit { font-size: 10px; font-weight: 600; padding: 5px 8px; }
    .zoom-row input[type="range"] { flex: 1; accent-color: #22d3ee; min-width: 0; }
    .zoom-value {
      font-size: 10px; font-family: monospace; color: #22d3ee;
      width: 38px; text-align: right; font-weight: 600;
    }

    /* --- Playback Row --- */
    .playback-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .playback-row button {
      padding: 7px 14px; border-radius: 6px; border: none; background: #2d3139;
      color: #e8eaed; font-weight: 600; cursor: pointer; transition: background 0.15s; font-size: 13px;
    }
    .playback-row button:hover { background: #3a3f4a; }
    .playback-row button.primary { background: #7c5cff; min-width: 44px; }
    .playback-row button.primary:hover { background: #6b4ce0; }
    .speed-control { display: flex; align-items: center; gap: 6px; flex: 1; }
    .speed-control label { font-size: 10px; color: #8b8f99; white-space: nowrap; }
    .speed-control input { flex: 1; accent-color: #7c5cff; min-width: 0; }
    .speed-value { font-size: 10px; font-family: monospace; color: #7c5cff; width: 30px; text-align: right; }

    /* --- Segment Editor --- */
    .segment-editor { background: #1e2128; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
    .segment-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
    .segment-inputs .full-width { grid-column: 1 / -1; }
    .segment-inputs input {
      width: 100%; padding: 6px 8px; border-radius: 4px;
      border: 1px solid #2d3139; background: #0f1115; color: #e8eaed;
      font-size: 11px; font-family: monospace;
    }
    .segment-inputs input[type="text"] { font-family: inherit; }
    .segment-inputs input:focus { outline: none; border-color: #7c5cff; }
    .segment-editor button {
      width: 100%; padding: 7px; border-radius: 6px; border: none;
      background: #22d3ee; color: #0f1115; font-weight: 600; cursor: pointer;
      font-size: 12px; transition: background 0.15s;
    }
    .segment-editor button:hover { background: #06b6d4; }

    /* --- Segments List --- */
    .segments-list { display: flex; flex-direction: column; gap: 3px; }
    .segment-item {
      display: flex; align-items: center; gap: 6px; padding: 7px 9px;
      background: #1e2128; border-radius: 6px; font-size: 11px;
      cursor: pointer; border: 1px solid transparent; transition: border-color 0.15s;
    }
    .segment-item:hover { border-color: #7c5cff55; }
    .segment-item .name {
      flex: 1; font-weight: 500; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .segment-item .time {
      color: #8b8f99; font-family: monospace; font-size: 10px; white-space: nowrap;
    }
    .segment-item .delete {
      background: transparent; border: none; color: #f87171;
      cursor: pointer; font-size: 13px; padding: 0 2px; line-height: 1;
    }
    .segment-item .delete:hover { color: #ef4444; }
    .empty-hint {
      text-align: center; color: #4b5563; font-size: 11px; padding: 12px; font-style: italic;
    }

    /* --- Actions --- */
    .actions button {
      width: 100%; padding: 11px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
      background: linear-gradient(90deg, #7c5cff, #6366f1); color: white; margin-bottom: 6px;
    }
    .actions button:last-child { margin-bottom: 0; }
    .actions button:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.1); }
    .actions button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .actions button.secondary { background: #2d3139; color: #e8eaed; }

    #status { margin-top: 8px; padding: 8px 10px; border-radius: 6px; font-size: 11px; display: none; }
    #status.visible { display: block; }
    #status.info { background: #1a2332; color: #60a5fa; }
    #status.success { background: #14261a; color: #4ade80; }
    #status.error { background: #2a1618; color: #f87171; }
    .progress { height: 3px; background: #2d3139; border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .progress-bar { height: 100%; background: linear-gradient(90deg, #7c5cff, #22d3ee); width: 0%; transition: width 0.2s; }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="dropzone">
      <div class="icon">📦</div>
      <div class="label">Перетащите .glb файл сюда</div>
      <div class="hint">или нажмите, чтобы выбрать</div>
    </div>
    <input type="file" id="fileInput" accept=".glb,.gltf" />
  </div>

  <div id="resizer"></div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>GLB Animation Editor</h1>
      <p class="subtitle">Нарезка, просмотр и экспорт фрагментов · <kbd>Space</kbd> — воспроизведение</p>
    </div>

    <div class="sidebar-body">
      <div class="section-title">Анимации</div>
      <div id="animations"></div>

      <div class="timeline-container" id="timeline">
        <div class="section-title">Таймлайн</div>
        <div class="time-labels">
          <span id="timeCurrent">0.00s</span>
          <span class="sel-info">Выделение: <span id="selDuration">0.00s</span></span>
          <span id="timeDuration">0.00s</span>
        </div>

        <div class="timeline-scroll" id="timelineScroll">
          <div class="track" id="track">
            <div class="ruler" id="ruler"></div>
            <div class="segments-layer" id="segmentsLayer"></div>
            <div class="selection" id="selection"></div>
            <div class="handle handle-start" id="handleStart">
              <div class="handle-bar"></div>
              <div class="handle-grip"></div>
            </div>
            <div class="handle handle-end" id="handleEnd">
              <div class="handle-bar"></div>
              <div class="handle-grip"></div>
            </div>
            <div class="playhead" id="playhead"></div>
          </div>
        </div>

        <div class="zoom-row">
          <button class="zoom-btn" id="zoomOut" title="Уменьшить">−</button>
          <input type="range" id="zoomRange" min="1" max="20" step="0.1" value="1" />
          <button class="zoom-btn" id="zoomIn" title="Увеличить">+</button>
          <span class="zoom-value" id="zoomValue">1.0x</span>
          <button class="zoom-btn fit" id="zoomFit" title="Вписать в окно">Fit</button>
        </div>

        <div class="playback-row">
          <button id="playBtn" class="primary">▶</button>
          <div class="speed-control">
            <label>Скорость</label>
            <input type="range" id="speedRange" min="0.1" max="2" step="0.1" value="1" />
            <span class="speed-value" id="speedValue">1.0x</span>
          </div>
        </div>

        <div class="section-title">Добавить фрагмент</div>
        <div class="segment-editor">
          <div class="segment-inputs">
            <input type="number" id="segStart" placeholder="Начало (с)" step="0.01" min="0" />
            <input type="number" id="segEnd" placeholder="Конец (с)" step="0.01" min="0" />
            <input type="text" id="segName" placeholder="Имя файла для экспорта" class="full-width" />
          </div>
          <button id="addSegmentBtn">+ Добавить фрагмент</button>
        </div>

        <div class="section-title">Фрагменты (<span id="segmentsCount">0</span>)</div>
        <div class="segments-list" id="segmentsList">
          <div class="empty-hint">Нет добавленных фрагментов</div>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="actions">
        <button id="exportBtn" disabled>Экспортировать все в ZIP</button>
        <button class="secondary" id="clearBtn">Сбросить файл</button>
      </div>
      <div id="status"></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.160.0",
      "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
      "@gltf-transform/core": "https://esm.sh/@gltf-transform/core@4.1.1",
      "@gltf-transform/extensions": "https://esm.sh/@gltf-transform/extensions@4.1.1",
      "@gltf-transform/functions": "https://esm.sh/@gltf-transform/functions@4.1.1",
      "jszip": "https://esm.sh/jszip@3.10.1"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { WebIO } from '@gltf-transform/core';
    import { KHRONOS_EXTENSIONS } from '@gltf-transform/extensions';
    import { cloneDocument } from '@gltf-transform/functions';
    import JSZip from 'jszip';

    // ============ THREE.JS SETUP ============
    const viewport = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x14161a);
    const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
    camera.position.set(0, 1.5, 4);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    viewport.appendChild(renderer.domElement);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.05; controls.target.set(0, 1, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(5, 10, 7); scene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight2.position.set(-5, 5, -7); scene.add(dirLight2);
    scene.add(new THREE.GridHelper(10, 20, 0x2d3139, 0x1e2128));

    // ============ STATE ============
    let currentDocument = null, currentFileName = '';
    let modelScene = null, mixer = null, currentAction = null, currentClip = null;
    let animations = [], segments = [];
    let isPlaying = false, isScrubbing = false;
    let dragTarget = null; // 'start' | 'end' | 'playhead' | null
    let zoom = 1;
    let clock = new THREE.Clock();

    // ============ DOM ============
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const animationsEl = document.getElementById('animations');
    const timelineEl = document.getElementById('timeline');
    const timelineScroll = document.getElementById('timelineScroll');
    const track = document.getElementById('track');
    const rulerEl = document.getElementById('ruler');
    const segmentsLayer = document.getElementById('segmentsLayer');
    const selectionEl = document.getElementById('selection');
    const handleStart = document.getElementById('handleStart');
    const handleEnd = document.getElementById('handleEnd');
    const playhead = document.getElementById('playhead');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeDuration = document.getElementById('timeDuration');
    const selDuration = document.getElementById('selDuration');
    const playBtn = document.getElementById('playBtn');
    const speedRange = document.getElementById('speedRange');
    const speedValue = document.getElementById('speedValue');
    const zoomRange = document.getElementById('zoomRange');
    const zoomValue = document.getElementById('zoomValue');
    const zoomIn = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');
    const zoomFit = document.getElementById('zoomFit');
    const segStart = document.getElementById('segStart');
    const segEnd = document.getElementById('segEnd');
    const segName = document.getElementById('segName');
    const addSegmentBtn = document.getElementById('addSegmentBtn');
    const segmentsList = document.getElementById('segmentsList');
    const segmentsCount = document.getElementById('segmentsCount');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');
    const statusEl = document.getElementById('status');
    const sidebar = document.getElementById('sidebar');
    const resizer = document.getElementById('resizer');

    // ============ RESIZER ============
    let isResizing = false;
    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      const newWidth = window.innerWidth - e.clientX;
      const clampedWidth = Math.max(340, Math.min(newWidth, Math.min(720, window.innerWidth - 200)));
      sidebar.style.width = clampedWidth + 'px';
      onViewportResize();
    });
    window.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    function onViewportResize() {
      const w = viewport.clientWidth, h = viewport.clientHeight;
      if (w === 0 || h === 0) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onViewportResize);
    if (window.ResizeObserver) {
      new ResizeObserver(() => onViewportResize()).observe(viewport);
    }

    // ============ ANIMATION LOOP ============
    function animate() {
      requestAnimationFrame(animate);
      controls.update();

      if (mixer && isPlaying && !isScrubbing && currentAction) {
        const delta = clock.getDelta();
        mixer.update(delta);

        // Проверяем границу сегмента
        const end = parseFloat(segEnd.value) || currentClip.duration;
        if (currentAction.time >= end) {
          // Дошли до конца выделения — фиксируем последнюю позу и останавливаемся
          currentAction.time = end;
          mixer.update(0);
          updatePlayhead(end);
          stopPlayback();
        } else {
          updatePlayheadUI();
        }
      } else {
        clock.getDelta();
      }

      renderer.render(scene, camera);
    }
    animate();

    // ============ DRAG & DROP ============
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('active'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('active'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault(); dropzone.classList.remove('active');
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => { if (e.target.files[0]) loadFile(e.target.files[0]); });

    // ============ LOAD FILE ============
    async function loadFile(file) {
      if (!file.name.match(/\.(glb|gltf)$/i)) return setStatus('error', 'Только .glb или .gltf');
      currentFileName = file.name;
      setStatus('info', 'Загружаю...');
      try {
        const buffer = new Uint8Array(await file.arrayBuffer());
        const io = new WebIO().registerExtensions(KHRONOS_EXTENSIONS);
        currentDocument = await io.readBinary(buffer);

        const loader = new GLTFLoader();
        const gltf = await loader.parseAsync(buffer.buffer, '');
        if (modelScene) scene.remove(modelScene);
        modelScene = gltf.scene;
        scene.add(modelScene);

        const box = new THREE.Box3().setFromObject(modelScene);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        controls.target.copy(center);
        camera.position.copy(center).add(new THREE.Vector3(0, size.y, size.z * 2));
        controls.update();

        animations = gltf.animations;
        mixer = new THREE.AnimationMixer(modelScene);
        segments = [];

        if (animations.length === 0) return setStatus('error', 'Нет анимаций.');
        renderAnimations();
        timelineEl.classList.add('visible');
        exportBtn.disabled = false;
        dropzone.style.display = 'none';
        setStatus('success', `Загружено: ${file.name}`);
      } catch (err) { console.error(err); setStatus('error', 'Ошибка: ' + err.message); }
    }

    // ============ ANIMATIONS LIST ============
    function renderAnimations() {
      animationsEl.innerHTML = '';
      animations.forEach((clip, idx) => {
        const item = document.createElement('div');
        item.className = 'anim-item';
        item.innerHTML = `
          <input type="radio" name="anim" id="anim_${idx}" value="${idx}" ${idx === 0 ? 'checked' : ''} />
          <label for="anim_${idx}">${escapeHtml(clip.name)}</label>
          <span class="index">#${idx}</span>
        `;
        item.addEventListener('click', (e) => {
          if (e.target.tagName !== 'INPUT') document.getElementById(`anim_${idx}`).checked = true;
          selectAnimation(idx);
          document.querySelectorAll('.anim-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
        });
        animationsEl.appendChild(item);
      });
      selectAnimation(0);
      document.querySelector('.anim-item').classList.add('active');
    }

    function selectAnimation(index) {
      currentClip = animations[index];
      if (currentAction) currentAction.stop();
      currentAction = mixer.clipAction(currentClip);
      currentAction.setLoop(THREE.LoopOnce, 1);
      currentAction.clampWhenFinished = true;
      currentAction.play();
      currentAction.paused = true;
      currentAction.timeScale = parseFloat(speedRange.value);
      isPlaying = false;
      playBtn.textContent = '▶';

      const duration = currentClip.duration;
      timeDuration.textContent = `${duration.toFixed(2)}s`;
      segStart.value = '0';
      segEnd.value = duration.toFixed(3);

      segments = [];
      zoom = 1;
      zoomRange.value = 1;
      updateZoomUI();

      renderSegments();
      updateSelectionUI();
      updatePlayhead(0);
      redrawRuler();
    }

    // ============ PLAYBACK & SPEED ============
    // --- Playback (с учётом границ сегмента) ---
    function startPlayback() {
      if (!currentAction || !currentClip) return;
      const start = parseFloat(segStart.value) || 0;
      const end = parseFloat(segEnd.value) || currentClip.duration;

      // Если Playhead вне выделенного диапазона — прыгаем в начало
      if (currentAction.time < start || currentAction.time >= end - 0.001) {
        currentAction.time = start;
        mixer.update(0);
        updatePlayhead(start);
      }

      isPlaying = true;
      currentAction.paused = false;
      playBtn.textContent = '⏸';
      clock.getDelta(); // сбрасываем накопленную дельту
    }

    function stopPlayback() {
      if (!currentAction) return;
      isPlaying = false;
      currentAction.paused = true;
      playBtn.textContent = '▶';
    }

    function togglePlayback() {
      if (!currentClip) return;
      if (isPlaying) stopPlayback();
      else startPlayback();
    }

    playBtn.addEventListener('click', togglePlayback);

    speedRange.addEventListener('input', () => {
      const speed = parseFloat(speedRange.value);
      speedValue.textContent = `${speed.toFixed(1)}x`;
      if (currentAction) currentAction.timeScale = speed;
    });

    // --- Spacebar toggle ---
    window.addEventListener('keydown', (e) => {
      // Не перехватываем, если пользователь печатает в поле ввода
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || document.activeElement?.isContentEditable) return;

      if (e.code === 'Space') {
        e.preventDefault();
        if (currentClip) togglePlayback();
      }
    });

    // ============ TIME CONVERSION HELPERS ============
    function timeToPercent(time) {
      if (!currentClip || currentClip.duration === 0) return 0;
      return (time / currentClip.duration) * 100;
    }

    function xToTime(clientX) {
      const rect = track.getBoundingClientRect();
      const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
      return (x / rect.width) * currentClip.duration;
    }

    // ============ PLAYHEAD ============
    function updatePlayhead(time) {
      if (!currentClip) return;
      time = Math.max(0, Math.min(time, currentClip.duration));
      if (currentAction) currentAction.time = time;
      mixer.update(0);
      timeCurrent.textContent = `${time.toFixed(2)}s`;
      playhead.style.left = `${timeToPercent(time)}%`;
    }

    function updatePlayheadUI() {
      if (!currentAction || !currentClip) return;
      const time = currentAction.time % currentClip.duration;
      timeCurrent.textContent = `${time.toFixed(2)}s`;
      playhead.style.left = `${timeToPercent(time)}%`;
      // Автоскролл при воспроизведении с зумом
      if (isPlaying && zoom > 1.05) {
        const px = (timeToPercent(time) / 100) * track.clientWidth;
        const sl = timelineScroll.scrollLeft;
        const sr = sl + timelineScroll.clientWidth;
        if (px < sl + 30 || px > sr - 30) {
          timelineScroll.scrollLeft = px - timelineScroll.clientWidth / 2;
        }
      }
    }

    // ============ DRAG LOGIC (handles + playhead + track click) ============
    handleStart.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      dragTarget = 'start';
      document.body.style.cursor = 'ew-resize';
      document.body.style.userSelect = 'none';
    });

    handleEnd.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      dragTarget = 'end';
      document.body.style.cursor = 'ew-resize';
      document.body.style.userSelect = 'none';
    });

    playhead.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      dragTarget = 'playhead';
      isScrubbing = true;
      if (isPlaying) playBtn.click();
    });

    track.addEventListener('mousedown', (e) => {
      if (dragTarget) return;
      if (!currentClip) return;
      // Клик по треку → перемещаем playhead
      dragTarget = 'playhead';
      isScrubbing = true;
      if (isPlaying) playBtn.click();
      updatePlayhead(xToTime(e.clientX));
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragTarget) return;

      // Авто-скролл при перетаскивании у краёв
      const scrollRect = timelineScroll.getBoundingClientRect();
      if (e.clientX > scrollRect.right - 30) timelineScroll.scrollLeft += 12;
      else if (e.clientX < scrollRect.left + 30) timelineScroll.scrollLeft -= 12;

      const t = xToTime(e.clientX);

      if (dragTarget === 'start') {
        const maxT = parseFloat(segEnd.value);
        const newStart = Math.max(0, Math.min(t, maxT - 0.001));
        segStart.value = newStart.toFixed(3);
        updateSelectionUI();
      } else if (dragTarget === 'end') {
        const minT = parseFloat(segStart.value);
        const newEnd = Math.min(currentClip.duration, Math.max(t, minT + 0.001));
        segEnd.value = newEnd.toFixed(3);
        updateSelectionUI();
      } else if (dragTarget === 'playhead') {
        updatePlayhead(t);
      }
    });

    window.addEventListener('mouseup', () => {
      if (dragTarget) {
        dragTarget = null;
        isScrubbing = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    // ============ SELECTION UI ============
    function updateSelectionUI() {
      if (!currentClip) return;
      const duration = currentClip.duration;
      let s = parseFloat(segStart.value) || 0;
      let e2 = parseFloat(segEnd.value) || duration;

      // Клампинг значений
      s = Math.max(0, Math.min(s, duration));
      e2 = Math.max(s + 0.001, Math.min(e2, duration));

      const sPct = (s / duration) * 100;
      const ePct = (e2 / duration) * 100;

      handleStart.style.left = `${sPct}%`;
      handleEnd.style.left = `${ePct}%`;

      selectionEl.style.left = `${sPct}%`;
      selectionEl.style.width = `${ePct - sPct}%`;

      selDuration.textContent = `${(e2 - s).toFixed(2)}s`;
    }

    // Синхронизация полей ввода с ползунками
    segStart.addEventListener('input', () => {
      if (!currentClip) return;
      let v = parseFloat(segStart.value);
      if (isNaN(v)) return;
      const maxEnd = parseFloat(segEnd.value) || currentClip.duration;
      if (v >= maxEnd) v = maxEnd - 0.001;
      if (v < 0) v = 0;
      updateSelectionUI();
    });
    segEnd.addEventListener('input', () => {
      if (!currentClip) return;
      let v = parseFloat(segEnd.value);
      if (isNaN(v)) return;
      const minStart = parseFloat(segStart.value) || 0;
      if (v <= minStart) v = minStart + 0.001;
      if (v > currentClip.duration) v = currentClip.duration;
      updateSelectionUI();
    });

    // ============ ZOOM ============
    function applyZoom(newZoom) {
      zoom = Math.max(1, Math.min(20, newZoom));
      zoomRange.value = zoom;
      track.style.width = `${zoom * 100}%`;
      updateZoomUI();
      redrawRuler();
      // После смены ширины нужно пересчитать позиции
      updateSelectionUI();
      if (currentAction && currentClip) {
        playhead.style.left = `${timeToPercent(currentAction.time)}%`;
      }
    }
    function updateZoomUI() { zoomValue.textContent = `${zoom.toFixed(1)}x`; }

    zoomRange.addEventListener('input', () => applyZoom(parseFloat(zoomRange.value)));
    zoomIn.addEventListener('click', () => applyZoom(zoom * 1.5));
    zoomOut.addEventListener('click', () => applyZoom(zoom / 1.5));
    zoomFit.addEventListener('click', () => { applyZoom(1); timelineScroll.scrollLeft = 0; });

    // Зум колесом мыши с Ctrl/Cmd
    timelineScroll.addEventListener('wheel', (e) => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      // Сохраняем "точку под курсором"
      const rect = timelineScroll.getBoundingClientRect();
      const mouseX = e.clientX - rect.left + timelineScroll.scrollLeft;
      const timeBefore = (mouseX / track.clientWidth) * currentClip.duration;
      applyZoom(zoom * factor);
      const newMouseX = (timeBefore / currentClip.duration) * track.clientWidth;
      timelineScroll.scrollLeft = newMouseX - (e.clientX - rect.left);
    }, { passive: false });

    // ============ RULER ============
    function redrawRuler() {
      if (!currentClip) return;
      rulerEl.innerHTML = '';
      const duration = currentClip.duration;
      const trackWidthPx = track.clientWidth || timelineScroll.clientWidth * zoom;
      const targetTicks = Math.max(4, Math.floor(trackWidthPx / 70));
      const rawStep = duration / targetTicks;
      const step = niceStep(rawStep);

      for (let t = 0; t <= duration + 1e-6; t += step) {
        const pct = (t / duration) * 100;
        const tick = document.createElement('div');
        tick.className = 'tick major';
        tick.style.left = `${pct}%`;
        rulerEl.appendChild(tick);

        const label = document.createElement('div');
        label.className = 'tick-label';
        label.style.left = `${pct}%`;
        label.textContent = formatTime(t);
        rulerEl.appendChild(label);
      }
      // Финальный тик в конце
      const endTick = document.createElement('div');
      endTick.className = 'tick major';
      endTick.style.left = '100%';
      rulerEl.appendChild(endTick);
    }

    function niceStep(raw) {
      const pow = Math.pow(10, Math.floor(Math.log10(raw)));
      const norm = raw / pow;
      let nice;
      if (norm < 1.5) nice = 1;
      else if (norm < 3) nice = 2;
      else if (norm < 7) nice = 5;
      else nice = 10;
      return nice * pow;
    }

    function formatTime(t) {
      if (t < 1) return t.toFixed(2) + 's';
      if (t < 10) return t.toFixed(2) + 's';
      if (t < 100) return t.toFixed(1) + 's';
      return t.toFixed(0) + 's';
    }

    // Перерисовка линейки при ресайзе контейнера
    if (window.ResizeObserver) {
      new ResizeObserver(() => { if (currentClip) redrawRuler(); }).observe(timelineScroll);
    }

    // ============ SEGMENTS ============
    addSegmentBtn.addEventListener('click', () => {
      if (!currentClip) return;
      const start = parseFloat(segStart.value);
      const end = parseFloat(segEnd.value);
      const name = segName.value.trim() || `Segment_${segments.length + 1}`;

      if (isNaN(start) || isNaN(end) || start >= end) return setStatus('error', 'Некорректные Start/End');
      if (start < 0 || end > currentClip.duration) {
        return setStatus('error', `Диапазон 0 - ${currentClip.duration.toFixed(2)}s`);
      }

      segments.push({ id: Date.now(), name, start, end });
      renderSegments();
      segName.value = '';
      setStatus('success', `Фрагмент "${name}" добавлен`);
    });

    function renderSegments() {
      segmentsList.innerHTML = '';
      segmentsLayer.innerHTML = '';
      segmentsCount.textContent = segments.length;

      if (segments.length === 0) {
        segmentsList.innerHTML = '<div class="empty-hint">Нет добавленных фрагментов</div>';
        return;
      }

      const duration = currentClip ? currentClip.duration : 1;

      segments.forEach(seg => {
        // Блок на таймлайне
        const block = document.createElement('div');
        block.className = 'segment-block';
        block.style.left = `${(seg.start / duration) * 100}%`;
        block.style.width = `${((seg.end - seg.start) / duration) * 100}%`;
        const label = document.createElement('div');
        label.className = 'segment-block-label';
        label.textContent = seg.name;
        block.appendChild(label);
        segmentsLayer.appendChild(block);

        // Строка в списке
        const item = document.createElement('div');
        item.className = 'segment-item';
        item.innerHTML = `
          <span class="name" title="${escapeHtml(seg.name)}">${escapeHtml(seg.name)}</span>
          <span class="time">${seg.start.toFixed(2)}s - ${seg.end.toFixed(2)}s</span>
          <button class="delete" title="Удалить">✕</button>
        `;
        // Клик по элементу — загружаем его в поля редактирования
        item.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete')) return;
          segStart.value = seg.start.toFixed(3);
          segEnd.value = seg.end.toFixed(3);
          segName.value = seg.name;
          updateSelectionUI();
        });
        item.querySelector('.delete').addEventListener('click', (e) => {
          e.stopPropagation();
          segments = segments.filter(s => s.id !== seg.id);
          renderSegments();
        });
        segmentsList.appendChild(item);
      });
    }

    // ============ EXPORT ============
    exportBtn.addEventListener('click', async () => {
      if (!currentDocument || segments.length === 0) return;
      exportBtn.disabled = true;
      exportBtn.textContent = 'Обрабатываю...';
      setStatus('info', 'Клонирую и нарезаю...<div class="progress"><div class="progress-bar" id="progressBar"></div></div>');

      try {
        const zip = new JSZip();
        const io = new WebIO().registerExtensions(KHRONOS_EXTENSIONS);
        const baseName = currentFileName.replace(/\.(glb|gltf)$/i, '');
        const targetAnimIndex = parseInt(document.querySelector('input[name="anim"]:checked').value);

        // Запоминаем имя целевой анимации ДО любых манипуляций
        const originalAnims = currentDocument.getRoot().listAnimations();
        if (!originalAnims[targetAnimIndex]) {
          throw new Error('Выбранная анимация не найдена в документе');
        }
        const targetAnimName = originalAnims[targetAnimIndex].getName() || '';

        // Сериализуем оригинал ОДИН РАЗ — это наш "шаблон"
        const originalBuffer = await io.writeBinary(currentDocument);
        const usedNames = new Set();

        for (let i = 0; i < segments.length; i++) {
          const seg = segments[i];

          // Свежая копия документа из буфера для каждого сегмента
          const cloned = await io.readBinary(originalBuffer);
          const root = cloned.getRoot();

          // Находим целевую анимацию: сначала по индексу, потом по имени
          const clonedAnims = root.listAnimations();
          let animToKeep = clonedAnims[targetAnimIndex];
          if (!animToKeep && targetAnimName) {
            animToKeep = clonedAnims.find(a => a.getName() === targetAnimName);
          }
          if (!animToKeep && clonedAnims.length > 0) {
            animToKeep = clonedAnims[0];
          }
          if (!animToKeep) {
            throw new Error(`Анимация не найдена для сегмента "${seg.name}"`);
          }

          // Удаляем все остальные анимации (animToKeep не трогаем)
          for (const anim of clonedAnims) {
            if (anim !== animToKeep) anim.dispose();
          }

          // Обрезаем ИМЕННО animToKeep (не перезапрашиваем список!)
          await trimAnimation(animToKeep, seg.start, seg.end);

          // Экспорт
          const glbBuffer = await io.writeBinary(cloned);
          const fileName = uniqueName(sanitize(seg.name), usedNames);
          zip.file(`${fileName}.glb`, glbBuffer);

          const bar = document.getElementById('progressBar');
          if (bar) bar.style.width = `${((i + 1) / segments.length) * 100}%`;
        }

        setStatus('info', 'Упаковываю в ZIP...');
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        downloadBlob(zipBlob, `${baseName}_segments.zip`);
        setStatus('success', `Готово! Экспортировано ${segments.length} файл(ов).`);
      } catch (err) {
        console.error(err);
        setStatus('error', 'Ошибка: ' + err.message);
      } finally {
        exportBtn.disabled = false;
        exportBtn.textContent = 'Экспортировать все в ZIP';
      }
    });


    async function trimAnimation(gltfAnim, startTime, endTime) {
      if (!gltfAnim) throw new Error('trimAnimation: анимация не передана');
      const channels = gltfAnim.listChannels();
      if (channels.length === 0) throw new Error('trimAnimation: у анимации нет каналов');

      for (const channel of channels) {
        const sampler = channel.getSampler();
        if (!sampler) continue;

        const inputAccessor = sampler.getInput();
        const outputAccessor = sampler.getOutput();
        if (!inputAccessor || !outputAccessor) continue;

        const times = inputAccessor.getArray();
        const values = outputAccessor.getArray();
        if (!times || !values || times.length === 0) continue;

        const stride = outputAccessor.getElementSize();
        const newTimes = [];
        const newValues = [];

        for (let i = 0; i < times.length; i++) {
          const t = times[i];
          if (t >= startTime && t <= endTime) {
            newTimes.push(t - startTime);
            for (let j = 0; j < stride; j++) {
              newValues.push(values[i * stride + j]);
            }
          }
        }

        // Fallback: если ни один ключ не попал в диапазон — берём ближайший
        if (newTimes.length === 0) {
          let closestIdx = 0, minDiff = Infinity;
          for (let i = 0; i < times.length; i++) {
            const diff = Math.min(Math.abs(times[i] - startTime), Math.abs(times[i] - endTime));
            if (diff < minDiff) { minDiff = diff; closestIdx = i; }
          }
          newTimes.push(0);
          for (let j = 0; j < stride; j++) {
            newValues.push(values[closestIdx * stride + j]);
          }
        }

        inputAccessor.setArray(new Float32Array(newTimes));
        outputAccessor.setArray(new Float32Array(newValues));
      }
    }

    // ============ RESET ============
    clearBtn.addEventListener('click', () => {
      if (modelScene) scene.remove(modelScene);
      modelScene = null; mixer = null; currentAction = null; currentClip = null;
      animations = []; segments = []; currentDocument = null; currentFileName = '';
      fileInput.value = ''; animationsEl.innerHTML = ''; timelineEl.classList.remove('visible');
      segmentsList.innerHTML = ''; segmentsLayer.innerHTML = ''; segmentsCount.textContent = '0';
      zoom = 1; applyZoom(1);
      exportBtn.disabled = true; dropzone.style.display = 'flex'; statusEl.classList.remove('visible');
    });

    // ============ HELPERS ============
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function sanitize(name) { return name.replace(/[\\/:*?"<>|]/g, '_').trim() || 'segment'; }
    function uniqueName(name, used) { let n = name, i = 1; while (used.has(n)) n = `${name}_${i++}`; used.add(n); return n; }
    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob); const a = document.createElement('a');
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function setStatus(type, message) { statusEl.className = `visible ${type}`; statusEl.innerHTML = message; }
  </script>
</body>
</html>
